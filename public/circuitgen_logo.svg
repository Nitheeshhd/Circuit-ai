<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for Exact 3D Hexagonal "C" -->
    <!-- 1. Top Outer Sloped Face -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#ffb020" />
      <stop offset="40%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>

    <!-- 2. Top-Right Inner Cut Face -->
    <linearGradient id="topInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#b43403" />
    </linearGradient>

    <!-- 3. Left Vertical Main Face (Spine) -->
    <linearGradient id="leftSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="35%" stopColor="#ea580c" />
      <stop offset="75%" stopColor="#9a3412" />
      <stop offset="100%" stopColor="#6c1e08" />
    </linearGradient>

    <!-- 4. Inner Shadow Crevice / Fold -->
    <linearGradient id="innerCavityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7c2d12" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>

    <!-- 5. Bottom Outer Sloped Face -->
    <linearGradient id="botFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#9a3412" />
      <stop offset="60%" stopColor="#6c1e08" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>

    <!-- 6. Bottom-Right Lower Face -->
    <linearGradient id="botRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#7c2d12" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#f97316" />
    </linearGradient>

    <!-- 7. Vibrant Orange Gradient for "AI" & Accent Dots -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f97316" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#f97316" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= 3D ISOMETRIC HEXAGONAL "C" EMBLEM ================= -->
  <g transform="translate(48, 16)" filter="url(#logoShadow)">
    <!-- Top Face of Hexagon -->
    <polygon points="56,98 152,42 248,98 198,127 152,101 92,135" fill="url(#topFaceGrad)" />
    
    <!-- Top Right Chamfer Bevel -->
    <polygon points="248,98 198,127 228,145 278,115" fill="url(#topInnerGrad)" />

    <!-- Left Main Vertical Spine -->
    <polygon points="56,98 92,135 92,201 56,218" fill="url(#leftSpineGrad)" />

    <!-- Inner Cavity Bevel/Slope -->
    <polygon points="92,135 152,101 198,127 178,145 138,123 92,158" fill="url(#innerCavityGrad)" />

    <!-- Bottom Sloped Main Face -->
    <polygon points="56,218 92,201 138,227 168,209 208,233 152,265" fill="url(#botFaceGrad)" />

    <!-- Bottom Right Ascending Terminal -->
    <polygon points="168,209 208,233 248,209 208,185" fill="url(#botRightGrad)" />

    <!-- Left PCB Circuit Traces & Solder Nodes (Exact 2 traces matching uploaded artwork) -->
    <!-- Trace 1 (Top Track) -->
    <path d="M 56,168 L 38,168 L 24,154 L 14,154" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="154" r="5" fill="#ffffff" />
    <circle cx="12" cy="154" r="2.2" fill="#ea580c" />

    <!-- Trace 2 (Bottom Track) -->
    <path d="M 56,190 L 38,190 L 24,176 L 14,176" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="176" r="5" fill="#ffffff" />
    <circle cx="12" cy="176" r="2.2" fill="#ea580c" />
  </g>

  <!-- ================= PRIMARY TYPOGRAPHY: CircuitGen AI ================= -->
  <!-- CircuitGen in Clean Dark Slate / Pure White -->
  <text
    x="152"
    y="336"
    text-anchor="end"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#0f172a"
  >CircuitGen</text>

  <!-- AI in Vibrant Orange Gradient -->
  <text
    x="162"
    y="336"
    text-anchor="start"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="-0.5"
    fill="url(#aiGrad)"
  >AI</text>

  <!-- ================= SUBTITLE TAGLINE: DESIGN • GENERATE • INNOVATE ================= -->
  <g transform="translate(200, 362)" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#64748b">
    <text x="-96" y="0">DESIGN</text>
    <circle cx="-42" cy="-3.5" r="2.5" fill="#f97316" />
    <text x="3" y="0">GENERATE</text>
    <circle cx="50" cy="-3.5" r="2.5" fill="#f97316" />
    <text x="100" y="0">INNOVATE</text>
  </g>
</svg>
